<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="login-page">

    <div class="container-fluid login-container">
        <div class="login-card">
            <div class="login-card-content">

                <div class="login-title">
                    <h2>LOGIN</h2>
                    <div class="login-underline"></div>
                </div>

                <form class="login-form">

                    <label for="username" class="username-label">
                        Username
                    </label>

                    <input type="text" id="username" name="username" class="form-control login-input"
                        placeholder="admin" required>

                    <div class="input-underline"></div>

                    <label for="password" class="password-label">
                        Password
                    </label>

                    <input type="password" id="password" name="password" class="form-control login-input"
                        placeholder="12345" required>

                    <div class="input-underline"></div>

                    <a href="#" class="forgot-password">
                        Forgot password?
                    </a>

                    <a href="/dashboard" class="login-button">Login</a>

                    <a href="#" class="signup-link">
                        Don't have account yet?
                    </a>

                </form>

            </div>
        </div>
    </div>

</body>

</html>
